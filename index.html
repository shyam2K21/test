<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11152b">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f6ff;
      --muted: #b4b7d0;
      --violet: #b79cff;
      --cyan: #85efff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 2rem;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 18% 20%, #563e91 0, transparent 34%),
        radial-gradient(ellipse at 85% 80%, #135b76 0, transparent 32%),
        linear-gradient(135deg, #11152b, #17152f 55%, #101d32);
    }

    .stars, .stars::before, .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background-image: radial-gradient(2px 2px at 20% 30%, #ffffffaa 50%, transparent 55%),
        radial-gradient(1px 1px at 70% 15%, #ffffff99 50%, transparent 55%),
        radial-gradient(1.5px 1.5px at 82% 55%, #ffffff99 50%, transparent 55%),
        radial-gradient(1px 1px at 35% 78%, #ffffff99 50%, transparent 55%),
        radial-gradient(1px 1px at 60% 88%, #ffffffaa 50%, transparent 55%);
      animation: twinkle 5s ease-in-out infinite alternate;
    }

    .stars::before { transform: translate(18px, 24px); opacity: .55; animation-delay: -2s; }
    .stars::after { transform: translate(-24px, -12px); opacity: .35; animation-delay: -4s; }

    main {
      position: relative;
      width: min(100%, 760px);
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid #ffffff25;
      border-radius: 32px;
      background: linear-gradient(145deg, #ffffff12, #ffffff05);
      box-shadow: 0 30px 100px #05081780, inset 0 1px #ffffff20;
      backdrop-filter: blur(18px);
      animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 1.5rem;
      color: var(--cyan);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .eyebrow::before, .eyebrow::after {
      width: 22px;
      height: 1px;
      content: "";
      background: currentColor;
      opacity: .7;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 12vw, 7.25rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 800;
    }

    h1 span {
      display: block;
      padding: 0 .08em .12em;
      color: transparent;
      background: linear-gradient(100deg, #fff 10%, var(--violet) 48%, var(--cyan) 90%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .message {
      max-width: 440px;
      margin: 1.6rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
    }

    .sparkle {
      display: inline-block;
      margin-left: .2em;
      color: #ffe49a;
      transform-origin: 60% 60%;
      animation: sparkle 2.8s ease-in-out infinite;
    }

    .signature {
      margin: 3rem 0 0;
      color: #ffffff70;
      font-size: .75rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }
    @keyframes sparkle { 0%, 100% { transform: rotate(0) scale(1); } 50% { transform: rotate(18deg) scale(1.18); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <p class="eyebrow">A little something for you</p>
    <h1>Hello,<span>World!</span></h1>
    <p class="message">A fresh page, a bright idea, and a whole world of possibility.<span class="sparkle" aria-hidden="true">✦</span></p>
    <p class="signature">Made with a little wonder</p>
  </main>
</body>
</html>
