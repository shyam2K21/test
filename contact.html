<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11152b">
  <title>Contact Us · Hello, World!</title>
  <style>
    :root { color-scheme: dark; --ink:#f7f6ff; --muted:#b4b7d0; --violet:#b79cff; --cyan:#85efff; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:6rem 1.5rem 2rem; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 18% 20%,#563e91 0,transparent 34%),radial-gradient(ellipse at 85% 80%,#135b76 0,transparent 32%),linear-gradient(135deg,#11152b,#17152f 55%,#101d32); }
    nav { position:absolute; top:1.5rem; right:clamp(1.25rem,5vw,4rem); display:flex; gap:.5rem; }
    nav a { padding:.65rem .9rem; border:1px solid transparent; border-radius:999px; color:var(--muted); font-size:.9rem; text-decoration:none; transition:.2s; }
    nav a:hover,nav a:focus-visible { color:var(--ink); border-color:#ffffff35; background:#ffffff12; outline:none; }
    nav a[aria-current="page"] { color:var(--ink); background:#ffffff15; }
    main { width:min(100%,760px); padding:clamp(2.5rem,8vw,5rem); border:1px solid #ffffff25; border-radius:32px; background:linear-gradient(145deg,#ffffff12,#ffffff05); box-shadow:0 30px 100px #05081780,inset 0 1px #ffffff20; backdrop-filter:blur(18px); animation:rise .8s ease both; }
    .eyebrow { margin:0 0 1.2rem; color:var(--cyan); font-size:.75rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(3rem,10vw,6rem); line-height:1; letter-spacing:-.07em; }
    h1 span { color:transparent; background:linear-gradient(100deg,#fff 10%,var(--violet) 48%,var(--cyan) 90%); background-clip:text; -webkit-background-clip:text; }
    .message { max-width:590px; margin:1.6rem 0 2rem; color:var(--muted); font-size:1.1rem; line-height:1.8; }
    .contact-card { display:flex; align-items:center; gap:1rem; padding:1.2rem 1.35rem; border:1px solid #ffffff20; border-radius:18px; background:#ffffff09; }
    .icon { display:grid; width:44px; height:44px; flex:none; place-items:center; border-radius:14px; color:#101d32; background:linear-gradient(135deg,var(--cyan),var(--violet)); font-size:1.25rem; }
    .label { margin:0 0 .25rem; color:#ffffff80; font-size:.7rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; }
    .email { color:var(--ink); font-size:1rem; text-decoration:none; overflow-wrap:anywhere; }
    .email:hover,.email:focus-visible { color:var(--cyan); outline:none; }
    @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @media (max-width:480px) { .contact-card { align-items:flex-start; } nav { left:1rem; right:auto; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <p class="eyebrow">The next good thing starts with a hello</p>
    <h1>Let’s <span>connect.</span></h1>
    <p class="message">Have an idea, a question, or just want to say hi? Send a note. We’d love to hear from you.</p>
    <div class="contact-card">
      <span class="icon" aria-hidden="true">✉</span>
      <div>
        <p class="label">Drop us a line</p>
        <a class="email" href="mailto:hello@example.com">hello@example.com</a>
      </div>
    </div>
  </main>
</body>
</html>
